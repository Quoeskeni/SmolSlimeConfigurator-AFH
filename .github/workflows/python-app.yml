name: Build SmolSlimeConfigurator

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} test artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SmolSlimeConfigurator-linux
            gui_artifact_name: SmolSlimeConfigurator-GUI-linux
          - os: windows-latest
            artifact_name: SmolSlimeConfigurator.exe
            gui_artifact_name: SmolSlimeConfigurator-GUI.exe
          - os: macos-latest
            artifact_name: SmolSlimeConfigurator-macos
            gui_artifact_name: SmolSlimeConfigurator-GUI-macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter pyserial requests

      - name: Syntax check
        run: |
          python -m py_compile SmolSlimeConfiguratorV9.py SmolSlimeConfiguratorV9one.py

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --onefile --name SmolSlimeConfigurator SmolSlimeConfiguratorV9.py
          pyinstaller --onefile --windowed --name SmolSlimeConfigurator-GUI SmolSlimeConfiguratorV9one.py
          mkdir -p upload
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/SmolSlimeConfigurator.exe "upload/${{ matrix.artifact_name }}"
            cp dist/SmolSlimeConfigurator-GUI.exe "upload/${{ matrix.gui_artifact_name }}"
          else
            cp dist/SmolSlimeConfigurator "upload/${{ matrix.artifact_name }}"
            cp dist/SmolSlimeConfigurator-GUI "upload/${{ matrix.gui_artifact_name }}"
            chmod +x "upload/${{ matrix.artifact_name }}" "upload/${{ matrix.gui_artifact_name }}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            upload/${{ matrix.artifact_name }}
            upload/${{ matrix.gui_artifact_name }}
