name: Build configurator binaries

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: SmolSlimeConfigurator.exe
            gui_asset_name: SmolSlimeConfigurator-GUI.exe
            sep: ';'
          - os: ubuntu-latest
            asset_name: SmolSlimeConfigurator-linux
            gui_asset_name: SmolSlimeConfigurator-GUI-linux
            sep: ':'
          - os: macos-latest
            asset_name: SmolSlimeConfigurator-macos
            gui_asset_name: SmolSlimeConfigurator-GUI-macos
            sep: ':'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyserial requests pyinstaller

      - name: Build single-file binary
        shell: bash
        run: |
          pyinstaller --onefile --name SmolSlimeConfigurator SmolSlimeConfiguratorV9.py
          pyinstaller --onefile --windowed --name SmolSlimeConfigurator-GUI SmolSlimeConfiguratorV9one.py

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p upload
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/SmolSlimeConfigurator.exe "upload/${{ matrix.asset_name }}"
            cp dist/SmolSlimeConfigurator-GUI.exe "upload/${{ matrix.gui_asset_name }}"
          else
            cp dist/SmolSlimeConfigurator "upload/${{ matrix.asset_name }}"
            cp dist/SmolSlimeConfigurator-GUI "upload/${{ matrix.gui_asset_name }}"
            chmod +x "upload/${{ matrix.asset_name }}" "upload/${{ matrix.gui_asset_name }}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            upload/${{ matrix.asset_name }}
            upload/${{ matrix.gui_asset_name }}

      - name: Upload asset to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            upload/${{ matrix.asset_name }}
            upload/${{ matrix.gui_asset_name }}
